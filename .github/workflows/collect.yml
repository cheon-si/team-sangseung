# 심야 지하철 실시간 수집을 GitHub Actions에서 매일 돌린다.
#
# 왜 여기서 돌리나: 노트북이 잠들거나 꺼지면 그날 밤이 통째로 사라진다.
# 러너는 항상 켜져 있고, 공개 저장소라 실행 시간 제한이 없다.
#
# 시간대 주의: 러너는 UTC다. TZ를 Asia/Seoul로 못 박지 않으면
# collect.py의 "22시까지 대기"가 다음 날 아침 7시(KST)를 겨냥한다.
#
# 예약: 14:00~21:00 KST 매시 정각, 하루 8개. GitHub 예약은 크게, 그리고 들쭉날쭉 늦는다.
# 실측 지연: 21:40 예약 → 02:15(9/17·9/18), 17:00 → 21:15·21:50(9/19·9/20),
#            16:00 → 22:39·21:23·21:34·21:33(9/21~9/24). 4시간 15분 ~ 6시간 39분.
# 예약 하나를 앞당기는 방식은 두 가지로 막혔다.
#   ① 지연 폭이 매일 달라 어느 시각에 걸어도 창을 놓치는 날이 생긴다.
#   ② GitHub 호스티드 러너는 job을 최대 6시간까지만 돌린다. 16:00 예약이 정시에 뜨면
#      22:00까지 6시간 기다리다 수집 시작 직전에 잘린다. (지연이 커서 아직 겪지는 않음)
# 그래서 예약을 여러 개 걸고, 창 근처에 뜬 하나만 수집하게 했다. collect.py가 창 밖에서 뜬 실행을 가른다.
#   - 창 시작까지 1.5시간 넘게 남음 → 너무 일찍 뜬 것. 바로 종료(성공)
#   - 창 시작까지 1.5시간 이내 → 기다렸다 수집. 대기 1.5h + 수집 4h라 6시간 안에 끝남
#   - 창 안 → 바로 수집
#   - 02:00~12:00에 뜸 → 어젯밤 몫. collected/에 어젯밤 폴더가 있으면 종료(성공), 없으면 실패(빨간색)
# 한 밤에 둘이 동시에 돌면 호출 한도를 넘는다. 아래 concurrency가 하나만 돌게 막는다.
# 수집 중에 뜬 실행은 대기열에 한 개만 남고(나머지는 취소, 회색 표시), 02:00 이후 풀려서
# 어젯밤 폴더를 보고 바로 끝난다.
#
# 데이터 보존: 러너는 끝나면 사라지므로 수집분을 압축해 collected/ 에 커밋한다.
# 하룻밤 원본 약 200MB → gzip 약 20MB.

name: collect-night

on:
  schedule:
    - cron: "0 5-12 * * *"  # 매일 14:00~21:00 KST 매시 정각 (위 주석 참고)
  workflow_dispatch:
    inputs:
      once:
        description: "true면 1틱만 수집하고 종료 (동작 확인용)"
        type: boolean
        default: false

permissions:
  contents: write            # 수집 결과를 저장소에 커밋하기 위해

concurrency:
  group: collect-night       # 예약과 수동 실행이 겹치면 API 한도를 두 배로 쓰므로 하나만
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # 대기 최대 1.5시간 + 수집 4시간 + 준비·커밋. 러너 상한 6시간(360분) 안쪽

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 실행
        env:
          SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
        run: |
          if [ "${{ inputs.once }}" = "true" ]; then
            python collect.py --once
          else
            python collect.py
          fi

      # 수집이 중간에 죽어도 그때까지 받은 것은 남긴다 (if: always)
      - name: 수집분 압축
        if: always()
        run: |
          shopt -s nullglob
          files=(data/raw/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "수집된 파일 없음"; exit 0
          fi
          # 파일명에서 운영일을 뽑아 폴더로 쓴다 (예: arrival_20260916.jsonl → 20260916)
          day=$(basename "${files[0]}" .jsonl | sed 's/.*_//')
          mkdir -p "collected/$day"
          for f in "${files[@]}"; do
            gzip -c "$f" > "collected/$day/$(basename "$f").gz"
          done
          cp logs/collect.log "collected/$day/collect.log" 2>/dev/null || true
          ls -la "collected/$day"

      - name: 저장소에 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collected/ || true
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"; exit 0
          fi
          git commit -m "collect: $(date +%Y-%m-%d) night"
          # 예약 실행 사이에 누군가 push했을 수 있으니 rebase 후 push
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
